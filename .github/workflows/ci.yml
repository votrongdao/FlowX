name: CI

on:
  push:
    # `release/**` as well as the trunks. A release branch is the one that ships, so it is
    # the last branch that should be running fewer gates than dev — and until this line it
    # ran none of them.
    branches: [master, dev, 'release/**']
  pull_request:
    branches: [master, dev, 'release/**']

# One run per ref per workflow. Without this every push queued a full duplicate and the
# superseded runs kept their place in line — six commits in an hour left the newest run
# behind five that nobody was waiting for. master is exempt: a run on the trunk finishes,
# because its result is what the ceiling and the release are read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # WHY THESE EXIST. Until 2026-08-01 this job stood up nothing, and
    # FLOWX_POSTGRES_CONNECTION and FLOWX_REDIS_CONNECTION were unset — so every test
    # needing a real store skipped. Measured on the merged tree: **166 of 2180 skipped**,
    # and they are not an edge: they are the journal, the fenced lease, the recovery scan,
    # retention, the outbox publisher, the Redis lease store and stream publisher, the CLI's
    # journal reader and both conformance suites. The subsystem this project exists to
    # provide — durable execution against a real database — was verified by nobody on any
    # pull request, while the run reported green.
    #
    # That is the shape of defect this repository keeps finding: not a gate that fails, a
    # gate whose subject is absent. The suite could not go red over a broken journal,
    # because it never opened one.
    #
    # Copied from chaos.yml's block, which was written to be the one the others copy:
    # pinned major versions, a health check so the suite never races a server, and a
    # password because the tests connect over TCP.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.12
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
      # The Service Bus emulator's own dependency. It is a service container rather than a
      # step so the emulator below can reach it by hostname on the job's network.
      sqledge:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          global-json-file: global.json

      # Kafka runs from the Apache release rather than a container, because Docker Hub is not
      # reachable from every runner this repository is built on and the tarball is. KRaft mode,
      # so there is no ZooKeeper to stand up beside it.
      - name: Start Apache Kafka
        run: |
          curl -sS -O https://archive.apache.org/dist/kafka/4.1.2/kafka_2.13-4.1.2.tgz
          tar -xzf kafka_2.13-4.1.2.tgz
          cd kafka_2.13-4.1.2
          KAFKA_CLUSTER_ID=$(bin/kafka-storage.sh random-uuid)
          bin/kafka-storage.sh format -t "$KAFKA_CLUSTER_ID" -c config/server.properties --standalone
          nohup bin/kafka-server-start.sh config/server.properties > "$RUNNER_TEMP/kafka.log" 2>&1 &
          # The suite's own rule turns an unreachable broker into a failure rather than a skip, so
          # the wait is what stops that firing on a broker that was merely still starting.
          for _ in $(seq 1 30); do
            bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 && break
            sleep 2
          done
          bin/kafka-topics.sh --bootstrap-server localhost:9092 --list

      # The Service Bus emulator is started as a step rather than as a service container,
      # because it needs a topology file mounted from the repository and a service container
      # is created before the checkout exists. ADR-0074 is why the file exists at all: this
      # package creates no entities, so the ones the suite reads have to come from somewhere
      # a deployment would put them.
      #
      # Port 5673, so it does not collide with the RabbitMQ container on 5672.
      - name: Start the Service Bus emulator
        run: |
          docker run -d --name flowx-sbemulator \
            --add-host host.docker.internal:host-gateway \
            -p 5673:5672 \
            -v "$GITHUB_WORKSPACE/tests/FlowX.AzureServiceBus.Tests/emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json" \
            -e ACCEPT_EULA=Y \
            -e SQL_SERVER=host.docker.internal \
            -e MSSQL_SA_PASSWORD='Str0ng!Passw0rd' \
            mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
          # It listens on 5672 inside the container and is published on 5673, because the
          # RabbitMQ service container already has 5672 on the host. SQL Edge is a service
          # container, so it is reached back across the bridge rather than by name.
          for _ in $(seq 1 30); do
            docker logs flowx-sbemulator 2>&1 | grep -q "Emulator Service is Successfully Up" && break
            sleep 5
          done
          docker logs flowx-sbemulator 2>&1 | tail -5

      - name: Restore
        run: dotnet restore FlowX.slnx

      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors — a warning nobody fixes
        # is a warning that hides the next one.
        run: dotnet build FlowX.slnx --configuration Release --no-restore

      - name: Restore the projects that are not in the solution
        # This exists for exactly one gate, and it does not implement it.
        #
        # DependencyLicencesAreCompatible (constraint C6, ADR-0012) vets the *resolved*
        # transitive dependency graph, which NuGet writes to obj/project.assets.json —
        # so it needs no network and no licence API, but it does need a restore to have
        # happened. `dotnet restore FlowX.slnx` above covers every project in the
        # solution. scripts/generator-cost-probe is deliberately outside it (a
        # measurement harness, not a build target), so nothing restores it and its
        # closure would go unread. One line here, and CI vets it too.
        #
        # This is NOT a second implementation of the licence rule. There is one, it is
        # the fitness function, and this repository has already deleted a shell copy of
        # a rule that had a test — see the `debt` job in quality.yml and docs/DEBT.md:
        # two gates for one rule disagree eventually, and the weaker one is what a
        # developer meets first. This step widens the gate's input and decides nothing.
        #
        # templates/FlowX.Templates/content/FlowX.Web is deliberately absent: it
        # references FlowX.* packages by version, and until WP-70 publishes them there
        # is no feed to restore from. Its declared references are still checked, and
        # docs/DEPENDENCIES.md §5 records that its closure is not. Add it here when
        # WP-70 lands.
        run: dotnet restore scripts/generator-cost-probe/GeneratorCostProbe.csproj

      - name: A transaction-pooling endpoint in front of the same database
        # PooledTenantIsolationTests is the only test that can see a cross-tenant read, and
        # it can only see one through a proxy that shares a server session between clients.
        # Without this step it skips, and a skip here reads exactly like a pass.
        #
        # Installed on the runner rather than added as a service container, deliberately:
        # a service needs to resolve `postgres` by name from its own container, and a
        # pooler that cannot reach its database refuses connections -- which the test
        # reports as a skip, because an endpoint being absent is a fact about the
        # deployment. That failure mode would be invisible. Here the endpoint is verified
        # below, so a broken pooler is red.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pgbouncer
          # Everything under the runner's own user in a writable directory. Not a style
          # choice: `pgbouncer` exits with "PgBouncer should not run as root", so the
          # obvious `sudo pgbouncer -d /etc/pgbouncer/pgbouncer.ini` fails, and running it
          # as `postgres` assumes an account no service-container job creates.
          cat > "$RUNNER_TEMP/pgbouncer.ini" <<'INI'
          [databases]
          postgres = host=127.0.0.1 port=5432 dbname=postgres

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = scram-sha-256
          auth_file = AUTH_FILE
          pool_mode = transaction
          default_pool_size = 1
          max_client_conn = 100
          logfile = LOG_FILE
          pidfile = PID_FILE
          unix_socket_dir = SOCKET_DIR
          INI
          sed -i "s|AUTH_FILE|$RUNNER_TEMP/userlist.txt|;s|LOG_FILE|$RUNNER_TEMP/pgbouncer.log|;s|PID_FILE|$RUNNER_TEMP/pgbouncer.pid|;s|SOCKET_DIR|$RUNNER_TEMP|" "$RUNNER_TEMP/pgbouncer.ini"
          # The stored verifier, copied rather than a password rewritten: pgbouncer proxies
          # SCRAM, so what it needs is exactly what pg_authid holds.
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -tAc \
            "SELECT '\"'||rolname||'\" \"'||rolpassword||'\"' FROM pg_authid WHERE rolname='postgres'" \
            > "$RUNNER_TEMP/userlist.txt"
          pgbouncer -d "$RUNNER_TEMP/pgbouncer.ini"
          # One round trip through the pooler, so that a pooler which did not come up fails
          # this step instead of turning the test it exists for into a skip.
          for attempt in 1 2 3 4 5; do
            if PGPASSWORD=postgres psql -h 127.0.0.1 -p 6432 -U postgres -d postgres -tAc 'SELECT 1'; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the pooled endpoint never answered, so tenant isolation through a pooler would have been skipped"
          exit 1

      - name: Architecture fitness functions
        # docs/05-Architecture.md §12. A red fitness function is a build failure,
        # not a discussion — so this step runs before the rest of the suite.
        run: dotnet test tests/FlowX.Architecture.Tests --configuration Release --no-build --logger "console;verbosity=detailed"

      - name: Unit and integration tests
        id: tests
        # Both connection strings are set, which is what makes the services above worth
        # having. The suites' own three-way rule then does the rest of the work: unset
        # means skip with a reason, and **set with no server reachable means FAIL, never
        # skip** — so a service container that fails to start turns this job red instead of
        # quietly returning it to the 166-skip state it was in before.
        env:
          FLOWX_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
          FLOWX_POSTGRES_POOLED_CONNECTION: "Host=127.0.0.1;Port=6432;Database=postgres;Username=postgres;Password=postgres"
          FLOWX_REDIS_CONNECTION: "localhost:6379"
          FLOWX_RABBITMQ_CONNECTION: "amqp://guest:guest@localhost:5672/"
          FLOWX_SERVICEBUS_CONNECTION: "Endpoint=sb://localhost:5673;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
          FLOWX_KAFKA_BOOTSTRAP: "localhost:9092"
        run: |
          # pipefail explicitly: the default shell takes the exit status of the LAST
          # command in a pipeline, so without it a failing test suite would be reported as
          # a passing step because tee succeeded. performance.yml's build-overhead job
          # carries the same line for the same reason.
          set -o pipefail
          dotnet test FlowX.slnx --configuration Release --no-build \
            --filter "FullyQualifiedName!~Architecture" \
            --collect:"XPlat Code Coverage" | tee /tmp/test-output.txt

      - name: No suite silently skipped its subject
        # The env vars above are one deletion away from being gone, and their absence is
        # invisible: the suite still passes, just over less. This asserts the thing that
        # would otherwise only be noticed by someone comparing test counts across runs.
        #
        # The threshold is deliberately loose. It is not "zero skips" — a suite is entitled
        # to skip a case for a reason of its own — it is "not the ~166 that mean no store
        # was reachable at all".
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          # Reads the run that already happened rather than running the suite a second
          # time — a guard that doubles the job's wall clock is a guard someone deletes.
          if [ ! -s /tmp/test-output.txt ]; then
            echo "::error::The test step produced no output to check."
            exit 1
          fi
          skipped=$(grep -oE 'Skipped:[[:space:]]+[0-9]+' /tmp/test-output.txt \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "Skipped across the suite: $skipped"
          if [ "$skipped" -gt 20 ]; then
            echo "::error::$skipped tests skipped. Before 2026-08-01 that number was 166 and"
            echo "::error::it meant no PostgreSQL and no Redis were reachable, so the journal,"
            echo "::error::the lease, recovery, retention, the outbox and both conformance"
            echo "::error::suites were never exercised on any pull request. Check the service"
            echo "::error::containers and the two connection strings on the step above."
            exit 1
          fi

  client:
    name: CRM web client
    runs-on: ubuntu-latest

    # WHY THIS EXISTS, and it is the same finding as the `build` job's block above wearing a
    # different hat. samples/crm-web carries some 240 Vitest tests, a strict `tsc` and an
    # ESLint config, and until now none of them ran anywhere except on the machine of whoever
    # last thought to type `npm test`. Every one of the twenty-two screens wired to the CRM
    # API could regress and this repository's four workflows — which build the platform,
    # measure its coverage, scan it four ways and publish its manifest — would all stay
    # green, because none of them so much as mentions npm.
    #
    # A gate whose subject is absent. Third time of writing that sentence down here.
    defaults:
      run:
        working-directory: samples/crm-web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          # No .nvmrc to read from, so the version is named here. Vite 6 wants an even
          # major on a current line; 22 is what the client is developed against.
          node-version: 22
          cache: npm
          cache-dependency-path: samples/crm-web/package-lock.json

      - name: Install
        # `ci`, not `install`: it installs the lockfile and fails if package.json has moved
        # away from it, which is the difference between building what was reviewed and
        # building whatever npm resolved this morning.
        run: npm ci

      # The order below is the repository's, and it is deliberate: the cheapest gate that
      # can fail runs first. Type-check (12s) before lint (30s) before tests (14s) before
      # the production build (11s) — a missing import should cost a quarter of a minute to
      # find out about, not four.
      - name: Type-check
        # tsconfig.json is strict AND carries noUncheckedIndexedAccess and
        # exactOptionalPropertyTypes, so this is not a formality: it is the gate that most
        # of the client's contracts are actually enforced by.
        run: npm run typecheck

      - name: Lint
        # --max-warnings 0, from package.json. Same reasoning as TreatWarningsAsErrors on
        # the .NET side: a warning nobody fixes is a warning that hides the next one.
        run: npm run lint

      - name: Unit tests
        # jsdom, no processes behind them. The browser suite is the `client-e2e` job below;
        # this one must stay the fast half.
        run: npm test

      - name: Build
        # `tsc -b && vite build`. Type-checking passing is not the same fact as the bundle
        # being producible — a bad asset import or a circular module fails only here.
        run: npm run build

      - name: The served config parses
        # NOTHING READ THIS FILE UNTIL NOW. `nginx.conf` is what serves the client in
        # production — the CSP, the SPA fallback and the /api proxy all live in it — and no
        # job in this repository opened it. Checkov scans `kubernetes,helm,dockerfile` and
        # skips outright while there is no `deploy/`; Semgrep's OWASP pack does not carry the
        # nginx rules. A typo in here is a container that crash-loops on first boot, found by
        # whoever deploys it.
        #
        # `nginx -t` in the image the Dockerfile actually ships, so the parser is the one that
        # will read the file. The content rule — no caller-controlled `Host` forwarded
        # upstream — is asserted in src/__tests__/architecture.test.ts, where a developer sees
        # it before pushing.
        # $GITHUB_WORKSPACE rather than ${{ github.workspace }}: an expression is expanded
        # into the script before the shell sees it, so the habit of reaching for one inside
        # `run:` is the habit that produced the injection finding this repository already
        # had. The variable is the same value and cannot be a shell fragment.
        #
        # --add-host, BECAUSE nginx RESOLVES THE UPSTREAM WHILE IT PARSES. `proxy_pass
        # http://api:8080` names a host literally rather than through a variable, and nginx
        # looks that name up at configuration-load time, not at request time. Compose gives it
        # `api` on its own network; a bare `docker run` gives it nothing, so the first run of
        # this step stopped at `[emerg] host not found in upstream "api" in
        # /etc/nginx/conf.d/default.conf:41` — the checker failing, not the config. The address
        # is never connected to: `nginx -t` parses and exits, so any resolvable value does.
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/samples/crm-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine nginx -t

  client-e2e:
    name: CRM web client browser suite
    runs-on: ubuntu-latest

    # Not folded into `client`, because it is a different bargain. `client` needs node and
    # thirty seconds; this needs PostgreSQL, a built and running ASP.NET host, a dev server
    # in front of it and a browser — and it is the only gate that covers the sixty-odd
    # screens the unit suite deliberately does not mount (3-15% line coverage there; see
    # quality.yml's `client-coverage`). Leaving it out would have meant claiming the client
    # was gated while the majority of it was not.
    #
    # Serial by construction: playwright.config.ts sets `workers: 1` because the three roles
    # walk one tenant's rows and one of them approves what another submitted.
    needs: client

    # The one number in this job that is a budget rather than a fact. Sixty-five tests, one
    # worker, a 90-second per-test timeout: a suite that has genuinely broken can spend an
    # hour and a half discovering it one timeout at a time, and the ninth of those tells a
    # reader nothing the first did not. GitHub's own default is six hours.
    timeout-minutes: 30

    services:
      # A fresh database per run, which is what makes the suite deterministic: the API's
      # CrmSeeder writes the seed on startup, and the specs that create rows name them with
      # a timestamp. Same block as `build` above, minus the four servers this sample does
      # not use — the CRM host takes RabbitMQ as optional and does not touch Redis, Kafka
      # or Service Bus.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/crm-web/package-lock.json

      - name: Install
        working-directory: samples/crm-web
        run: npm ci

      - name: Install Chromium
        working-directory: samples/crm-web
        # Chromium only. The suite asserts on the words the server sent back, not on
        # rendering, so three engines would be three times the wall clock for the same
        # facts. `--with-deps` because a bare runner has none of the shared libraries.
        run: npx playwright install --with-deps chromium

      - name: Build the CRM host
        # Built, then run from the dll. `dotnet run` would rebuild inside the "start the
        # server" step, so a compile error would surface there as a health check that timed
        # out rather than as a build that failed.
        run: dotnet build samples/crm/Crm.csproj --configuration Release

      - name: Start the CRM host
        # Port 5000 and nothing else, because samples/crm-web/vite.config.ts proxies /api
        # there by default. Overriding CRM_API would work and would also mean the thing CI
        # exercises is not the thing a developer runs.
        #
        # THE SEED IS ASKED FOR, BECAUSE IT WAS ONLY EVER ASSUMED. This comment used to say
        # that /health answering 200 was "also the statement that the schema exists and the
        # seed landed". Half of that was true. Migrations do run on startup; the seed does not
        # unless CRM_SEED_FILE names a file, and this job never named one — so the suite ran
        # against a schema with no rows in it. Forty of the sixty-five tests then sat waiting
        # ninety seconds each for a deal, a quote or a process that was never written, and the
        # job hit its thirty-minute ceiling. The tests that passed were the ones about an empty
        # tenant, which is the shape of a suite quietly measuring the wrong world.
        #
        # CRM_SEED_ALLOW_PRODUCTION rather than DOTNET_ENVIRONMENT=Development: the seeder
        # refuses to write into a Production environment without being told the writing is
        # intended, and that is exactly what this is — a throwaway database that wants rows.
        # Saying so keeps the host in the configuration a deployment actually runs, instead of
        # turning on developer behaviour underneath a suite that is meant to exercise the
        # deployed one.
        env:
          FLOWX_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
          ASPNETCORE_URLS: "http://127.0.0.1:5000"
          CRM_SEED_FILE: samples/crm/seed/northwind.json
          CRM_SEED_ALLOW_PRODUCTION: "true"
        run: |
          nohup dotnet samples/crm/bin/Release/net10.0/Crm.dll > "$RUNNER_TEMP/crm-api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5000/health > /dev/null || {
            echo "::error::The CRM host never became healthy. Its log follows."
            tail -50 "$RUNNER_TEMP/crm-api.log"
            exit 1; }

          # AND THE SEED IS CHECKED, NOT TRUSTED. A healthy host with an empty tenant is what
          # this job shipped for its whole life; the only thing that would have caught it is
          # asking. CrmSeeder logs one line per tenant it applies. Polled rather than read
          # once, because it is a hosted service and nothing orders it against the moment the
          # server starts answering — a single grep would be a race this job cannot afford to
          # lose quietly.
          for _ in $(seq 1 30); do
            grep -q "Seeded tenant" "$RUNNER_TEMP/crm-api.log" && break
            sleep 2
          done

          grep -q "Seeded tenant" "$RUNNER_TEMP/crm-api.log" || {
            echo "::error::The host is healthy and the seed did not run, so the suite would"
            echo "::error::spend thirty minutes discovering an empty database. Its log follows."
            tail -50 "$RUNNER_TEMP/crm-api.log"
            exit 1; }

          grep "Seeded tenant" "$RUNNER_TEMP/crm-api.log"

      - name: Start the client
        working-directory: samples/crm-web
        # The dev server, not `vite preview`. The /api proxy lives in `server.proxy`, which
        # preview does not read — a preview build would serve the pages and 404 every
        # request behind them, which presents as sixty-five inscrutable timeouts.
        #
        # --host 127.0.0.1, BECAUSE "READY" IS NOT "REACHABLE". Vite's default host is
        # `localhost`, and it binds to whatever that resolves to first: IPv4 on a developer's
        # machine, `::1` on this runner. The Vite 8 upgrade turned that into a hung job — the
        # log said `ready in 242 ms` while sixty seconds of `curl http://127.0.0.1:5173/`
        # found nothing listening, because nothing was, on that address. Naming the interface
        # makes the address the health check uses and the address CRM_E2E_BASE_URL names the
        # same one the server is actually on. Left out of vite.config.ts on purpose: a
        # developer running `npm run dev` should still get both stacks.
        run: |
          nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null || {
            echo "::error::The dev server never answered. Its log follows."
            tail -50 "$RUNNER_TEMP/vite.log"
            exit 1; }

      - name: Browser suite
        working-directory: samples/crm-web
        # Setting CRM_E2E_BASE_URL is the caller saying a client and an API exist. The spec's
        # own rule then does the rest: unset means the whole file skips with a reason, and set
        # with nothing listening means it FAILS. That is the same three-way bargain
        # FLOWX_POSTGRES_CONNECTION strikes on the .NET side, and it is what stops this job
        # from reporting green over a suite that never opened a page.
        #
        # The JSON reporter is named here rather than in playwright.config.ts so a developer
        # running the suite by hand still gets `list` and nothing else; the file is only for
        # the guard below.
        env:
          CRM_E2E_BASE_URL: http://127.0.0.1:5173
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-results.json
        run: npx playwright test --reporter=list,json

      - name: The suite is not allowed to have skipped itself
        if: always()
        working-directory: samples/crm-web
        # The env var above is one deletion away from being gone and its absence is silent:
        # `test.skip(!configured, …)` turns all sixty-five green. Reads the JSON report
        # rather than re-running anything, for the reason the `build` job's skip guard gives.
        run: |
          [ -f "$RUNNER_TEMP/e2e-results.json" ] || exit 0
          python3 - "$RUNNER_TEMP/e2e-results.json" <<'PY'
          import json, sys
          counts = json.load(open(sys.argv[1])).get('stats', {})
          print(counts)
          # Anything that reached a browser, passing or not. NOT `expected == 0`: a suite in
          # which every test failed also reports zero expected, and this step would then
          # answer a real red run with the one explanation that is wrong.
          ran = counts.get('expected', 0) + counts.get('unexpected', 0) + counts.get('flaky', 0)
          if ran == 0:
              print(f"::error::All {counts.get('skipped', 0)} tests in e2e/roles.spec.ts skipped —")
              print('::error::none of them opened a page. CRM_E2E_BASE_URL is what makes the file')
              print('::error::execute rather than skip; check the step above set it.')
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          # The traces, which playwright.config.ts retains on failure, and the page snapshot
          # beside each. `npx playwright show-trace <the zip>` replays the run that failed —
          # which is the only way to debug a browser test from a log, and the reason this
          # step exists rather than a longer tail of console output.
          name: crm-web-playwright-traces
          path: samples/crm-web/test-results/

  template:
    name: dotnet new flowx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          global-json-file: global.json

      - name: The template generates a project that builds clean and serves a request
        # templates/README.md called this "the acceptance test, and what CI should run",
        # and until now nothing ran it — so `dotnet new flowx` was verified by whoever
        # last remembered to, which is the definition of a gate that does not exist.
        #
        # Its own job, not a step in `build`, for two reasons. It is not about the
        # solution: the template pack is deliberately outside FlowX.slnx, and the thing
        # under test is `dotnet new`, `dotnet restore` against a feed, and a process
        # listening on a socket. And it is machine-global — it registers a NuGet source
        # and installs a template — which is fine on a throwaway runner and is not
        # something to do halfway through the test job.
        #
        # The script packs the seven packages a generated project resolves, evicting
        # them from the NuGet cache first: the version does not change between runs, and
        # NuGet caches by id AND version, so without the eviction a second run verifies
        # the first run's assemblies and reports green against stale output.
        run: templates/verify.sh

  aot:
    name: NativeAOT smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          global-json-file: global.json

      - name: Trim and AOT analyzers must be clean
        # Constraint C2. For libraries the real gate is the analyzer, which
        # Directory.Build.props enables on everything under src/ via
        # IsAotCompatible. A reflection call that would break trimming surfaces
        # here as an IL2xxx/IL3xxx error at build time, not at publish time.
        run: |
          # pipefail, for the reason the test step in `build` spells out: without it the
          # step's exit status is tee's, so a build that FAILED reports a passing step and
          # the grep runs over a truncated log.
          set -o pipefail
          dotnet build FlowX.slnx --configuration Release 2>&1 | tee build.log
          if grep -qE 'IL2[0-9]{3}|IL3[0-9]{3}'  build.log; then
            echo "::error::Trim or AOT warnings found — constraint C2 forbids them."
            exit 1
          fi

      - name: NativeAOT publish
        # The reference sample is the executable that makes constraint C2 checkable:
        # PublishAot is a no-op on a class library, so until WP-10 this step had
        # nothing to publish and said so rather than passing vacuously.
        #
        # PublishAot is NOT passed with /p: here, and that is the whole point. A property
        # given on the command line is a *global* property: MSBuild passes it down into
        # every project this one references, including the two that are referenced as
        # analyzers — FlowX.Compiler and FlowX.Compiler.CodeFixes, both netstandard2.0,
        # because that is what Roslyn loads. netstandard2.0 cannot be AOT-compiled, so
        # each answered with NETSDK1207 and the publish produced no binary at all.
        #
        # samples/ecommerce/Ecommerce.csproj already sets <PublishAot>true</PublishAot> in
        # its own PropertyGroup, where it applies to that project and stops there. So this
        # is not a relaxation of constraint C2: the sample is still published ahead of
        # time, by the declaration that was always the right place for it. The command
        # line asking for it a second time is what broke it.
        run: |
          set -o pipefail
          dotnet publish samples/ecommerce/Ecommerce.csproj --configuration Release \
            --runtime linux-x64 --self-contained \
            /p:TrimmerSingleWarn=false 2>&1 | tee aot.log
          if grep -qE 'IL2[0-9]{3}|IL3[0-9]{3}' aot.log; then
            echo "::error::Trim or AOT warnings in the AOT publish."
            exit 1
          fi

          # The publish having "succeeded" is not the same fact as a binary existing, and
          # for days it was not the same fact here. Assert the artifact, so a publish that
          # emits nothing fails in the step that was supposed to produce it rather than in
          # the next one as a puzzling "did not become healthy".
          BIN=samples/ecommerce/bin/Release/net10.0/linux-x64/publish/Ecommerce
          test -x "$BIN" || {
            echo "::error::The publish reported success but produced no native binary at $BIN."
            exit 1; }

      - name: The native binary serves a request
        # Publishing proves it links. This proves it runs: a trim-related failure that
        # the analyzer misses shows up at startup or on the first request, and a build
        # that only checks for IL warnings would report success anyway.
        run: |
          BIN=samples/ecommerce/bin/Release/net10.0/linux-x64/publish/Ecommerce
          ASPNETCORE_URLS=http://127.0.0.1:5210 "$BIN" &
          APP=$!
          trap 'kill $APP 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5210/health >/dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:5210/health >/dev/null || {
            echo "::error::The native binary did not become healthy."; exit 1; }

          # A no-token request must be refused, and it is asserted FIRST because it is the
          # cheaper half of the same fact: authorisation is decided by the engine, from
          # validated claims, inside a natively-compiled binary. An AOT build that lost the
          # claims plumbing would answer 200 here and this step would otherwise applaud it.
          UNAUTH=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5210/api/v1/orders \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-smoke-anon' \
            -d '{"sku":"SKU-1","quantity":1,"paymentToken":"tok"}')
          [ "$UNAUTH" = "403" ] || {
            echo "::error::An unauthenticated order got $UNAUTH, not 403. order.validate declares"
            echo "::error::Authorization.Authenticated and the engine must enforce it in the AOT build too."
            exit 1; }

          # And the positive case needs a caller who satisfies BOTH stances the flow
          # declares: order.validate wants any authenticated principal, payment.capture
          # wants the payment.write permission. Tokens.Cashier in samples/ecommerce is the
          # one demonstration token holding it; Tokens.Shopper deliberately does not, and
          # is refused at the third step after the inventory hold is compensated.
          BODY=$(curl -sf -X POST http://127.0.0.1:5210/api/v1/orders \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer cashier-token' \
            -H 'Idempotency-Key: ci-smoke' \
            -d '{"sku":"SKU-1","quantity":1,"paymentToken":"tok"}') || {
            echo "::error::The native binary refused a valid order."; exit 1; }

          echo "$BODY"
          echo "$BODY" | grep -q '"receiptId"' || {
            echo "::error::The response did not carry the flow's declared output."; exit 1; }

      - name: Time the cold start of the binary this job just published
        # Criterion V5 is "cold start ≤ 200 ms, NativeAOT-compatible". The step above
        # answers the second half on every push; nothing answered the first until now, so
        # the number lived in docs/benchmarks/V5-cold-start.md and was compared to 200 ms
        # by whoever last read it.
        #
        # THE SAME BINARY, not another one. tests/FlowX.ColdStart.Bench publishes for
        # itself by default, which would spend two more minutes producing a second native
        # image and then report a start-up time for a binary no other step in this job ever
        # ran. `--no-publish` reads whatever is in .artifacts/coldstart-aot/, so the publish
        # the smoke test above accepted is moved there and measured.
        run: |
          BIN=samples/ecommerce/bin/Release/net10.0/linux-x64/publish
          mkdir -p .artifacts
          cp -r "$BIN" .artifacts/coldstart-aot

          dotnet run --project tests/FlowX.ColdStart.Bench --configuration Release -- \
            --no-publish --json .artifacts/cold-start.json

          # The rig records nothing when it cannot measure — a timed-out start is not a
          # sample — so the results document existing is asserted rather than assumed. A
          # checker run over a missing or stale file would turn a broken run into a verdict.
          test -s .artifacts/cold-start.json || {
            echo "::error::The cold-start rig wrote no results document, so V5 was not measured on this run."
            exit 1; }

      - name: V5 gate — cold start at p50 against the 200 ms ceiling
        # The verdict, from the rig's JSON rather than from its console output. The ceiling
        # is V5's own number; the percentile is the median, and scripts/check-cold-start.py
        # carries the argument for that from docs/benchmarks/V5-cold-start.md — two runs of
        # one commit on one container agreed to 2 % at p50 and moved 26 % at p99, so a tail
        # gate would fire on the runner's scheduler rather than on the code. p95, p99, min,
        # max, the port-open phase and the binary's size are printed on every run and gate
        # nothing.
        run: |
          # pipefail, for the reason the steps above spell out: without it the step's exit
          # status is tee's, and a FAIL verdict would be reported as a passing step.
          set -o pipefail
          python3 scripts/check-cold-start.py .artifacts/cold-start.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The V5 gate can fail
        # The same assertion .github/workflows/performance.yml makes of the generator-cost
        # and benchmark-budget gates, and for the same reason: a gate is only worth the run
        # it costs if a breach makes it red. Re-judging the run that just passed against a
        # 1 ms ceiling costs a JSON parse and proves the comparison is live.
        run: |
          if python3 scripts/check-cold-start.py .artifacts/cold-start.json --budget 1 \
               > /tmp/cold-start-selftest.txt 2>&1; then
            echo "::error::A 1 ms ceiling was reported as met, so the V5 gate above passes whatever the rig measured."
            cat /tmp/cold-start-selftest.txt
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          # Only on a red run, and it is the measurement rather than a log: a breached
          # ceiling is argued about with the thirty starts behind it, and the step summary
          # above only carries the percentiles.
          name: cold-start-v5
          path: .artifacts/cold-start.json
          if-no-files-found: ignore

  manifest:
    name: Manifest compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          global-json-file: global.json

      - name: The sample's manifest must stay compatible with its committed baseline
        # ADR-0005 makes the manifest a build artifact so it can be COMPARED. Until
        # something compares two of them the artifact is a description nobody acts on,
        # so this is the step that gives it teeth.
        #
        # The baseline is committed on purpose. A contract change then arrives as a
        # reviewable diff of samples/ecommerce/flowx.manifest.baseline.json rather than
        # as a number in a log, which is the same reasoning the benchmark baseline uses.
        # Regenerate it deliberately when the change is intended:
        #
        #   dotnet run --project src/FlowX.Cli -- manifest \
        #     --assembly samples/ecommerce/bin/Release/net10.0/Ecommerce.dll \
        #     --output samples/ecommerce/flowx.manifest.baseline.json
        run: |
          dotnet build samples/ecommerce/Ecommerce.csproj --configuration Release

          # The CLI has to be built before it can be run with --no-build, and nothing else
          # in this job builds it: it is deliberately not referenced by anything (see the
          # comment in FlowX.Cli.csproj — CliLinksNoFlowXAssembly asserts the absence), so
          # building the sample cannot drag it in. Without this line `dotnet run --no-build`
          # looked for bin/Release/net10.0/flowx, which is the right path — AssemblyName is
          # `flowx` — for a binary nothing had produced. The docs job already builds it this
          # way before running `flowx graph`.
          dotnet build src/FlowX.Cli --configuration Release

          dotnet run --project src/FlowX.Cli --configuration Release --no-build -- manifest \
            --assembly samples/ecommerce/bin/Release/net10.0/Ecommerce.dll \
            --output "$RUNNER_TEMP/candidate.manifest.json"

          # No `if` and no wrapper: flowx diff exits 1 on a breaking change, and that
          # exit code is the gate.
          dotnet run --project src/FlowX.Cli --configuration Release --no-build -- diff \
            --old samples/ecommerce/flowx.manifest.baseline.json \
            --new "$RUNNER_TEMP/candidate.manifest.json"

  docs:
    name: Documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          global-json-file: global.json   # the flow-graph step below runs the CLI

      - name: Mermaid diagrams parse
        # 70+ diagrams. A diagram that does not render is a broken document, and GitHub
        # gives no error when one fails silently.
        #
        # This step used to report the whole truth as one line: "mermaid diagram failed to
        # parse". The file was passed as `file=` on the annotation, which the web UI shows
        # against the file and which does NOT appear in the log — so anyone reading the log,
        # which is what you get from the CLI, an API client or a notification, learned that
        # one of seventy-odd diagrams somewhere was broken and nothing else. Finding it meant
        # reinstalling mermaid-cli locally and bisecting by hand. The parser's own message,
        # which says the line and the token, was being sent to /dev/null.
        #
        # So: name the file and the diagram's index in the log body, print the diagram, and
        # print what mermaid actually said. The stack frames are dropped because they are
        # puppeteer's, never the document's.
        run: |
          npm install -g @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox"]}' > /tmp/pptr.json
          fail=0
          while IFS= read -r file; do
            rm -f /tmp/block*.mmd
            python3 - "$file" <<'PY' > /tmp/blocks.txt
          import re, sys
          text = open(sys.argv[1]).read()
          for i, m in enumerate(re.finditer(r'```mermaid\n(.*?)```', text, re.S), 1):
              open(f'/tmp/block{i}.mmd', 'w').write(m.group(1))
              print(f'/tmp/block{i}.mmd')
          PY
            n=0
            while IFS= read -r block; do
              n=$((n + 1))
              if ! mmdc -i "$block" -o /tmp/out.svg -p /tmp/pptr.json > /tmp/mmdc.log 2>&1; then
                echo "::error file=$file::mermaid diagram #$n failed to parse"
                echo "=== $file: diagram #$n does not parse ==="
                sed 's/^/    /' "$block"
                echo "--- mermaid said ---"
                grep -vE '^\s+at ' /tmp/mmdc.log | sed 's/^/    /'
                echo "==="
                fail=1
              fi
            done < /tmp/blocks.txt
          # Every tracked markdown file, not `find docs samples`. A diagram in PLAN.md or in
          # a README outside those two trees renders on the same GitHub page as the rest and
          # was checked by nothing; `git ls-files` also cannot wander into node_modules or a
          # bin/ directory the way a bare `find` over the repository would.
          done < <(git ls-files '*.md')
          exit $fail

      - name: Rendered flow graph parses
        # WP-9's exit criterion. The renderer's unit tests check structure — every edge
        # references a declared node, every subgraph is closed — but only a real Mermaid
        # parser proves the file renders. A diagram that silently fails to render is the
        # failure mode a human eye skims past.
        run: |
          dotnet build src/FlowX.Cli --configuration Release
          dotnet run --configuration Release --project src/FlowX.Cli -- \
            graph --manifest tests/FlowX.Cli.Tests/fixtures/sample.manifest.json \
            --output /tmp/graph.mmd
          npm install -g @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox"]}' > /tmp/pptr.json
          mmdc -i /tmp/graph.mmd -o /tmp/graph.svg -p /tmp/pptr.json
          test -s /tmp/graph.svg || { echo "::error::mmdc produced no output."; exit 1; }

      - name: Internal links resolve
        run: |
          python3 - <<'PY'
          import os, re, sys
          # The three infographics docs/assets/README.md declares are drawn by the
          # repository owner and are not in the tree. They were failing this job on
          # every run, which made a red docs gate the normal state and hid a real
          # break behind it. Named individually so a fourth missing asset still fails.
          absent = {
              'docs/assets/flowx-overview.png',
              'docs/assets/flowx-platform-map.png',
              'docs/assets/flowx-runtime-architecture.png',
          }
          bad = []
          for root, _, files in os.walk('.'):
              # node_modules is excluded for the reason the anchor step below excludes it:
              # a dependency's own README is not this repository's documentation, and its
              # broken links are not this repository's to fix. CI never installs them in
              # this job, so the exclusion only matters to somebody running it locally --
              # where, without it, this step reports a hundred failures from `undici` and
              # `css-tree` and nobody reads the two that are real.
              if '.git' in root or '.claude' in root or 'node_modules' in root:
                  continue
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(root, f)
                  for m in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', open(p).read()):
                      link = m.group(1)
                      if link.startswith(('http', '#', 'mailto')):
                          continue
                      target = link.split('#')[0]
                      if not target:
                          continue
                      resolved = os.path.normpath(os.path.join(root, target))
                      if os.path.relpath(resolved) in absent or os.path.exists(resolved):
                          continue
                      bad.append(f'{p} -> {link}')
          # An exemption outlives its reason silently. This one cannot.
          for a in sorted(absent):
              if os.path.exists(a):
                  bad.append(f'{a} exists — remove it from the exemption list in this job')
          for b in bad:
              print(f'::error::broken link {b}')
          sys.exit(1 if bad else 0)
          PY

      - name: Internal anchors resolve
        # A link's PATH was checked above and its #fragment was thrown away, so a renamed
        # heading broke navigation in silence. It had: nineteen links pointed at headings
        # that no longer existed, several of them at section titles carrying a count that
        # had since changed -- "four of seven metrics emit" against a heading that now
        # says seven of seven. Same failure mode as a budget column nobody checks.
        #
        # Slug rules match GitHub's: lower-case, link labels replaced by their text,
        # backticks dropped, anything that is not a letter, digit, space or hyphen removed,
        # spaces to hyphens.
        run: |
          python3 - <<'PY'
          import os, re, sys

          # ADR-0020 references a section "Owed work, named so it is not lost" that the
          # record does not contain. That is a content gap inside an Accepted ADR, not a
          # renamed heading, and this repository does not edit accepted records -- see
          # PLAN open item 18 for the decision that is owed. Exempted by exact link so a
          # different broken anchor in the same file still fails.
          # ADR-0020 references a section "Owed work, named so it is not lost" that the
          # record does not contain. That is a content gap inside an Accepted ADR, not a
          # renamed heading, so it is not repointed -- there is nowhere correct to point it,
          # and this repository does not add sections to accepted records.
          #
          # Six fragments in ADR-0026, ADR-0040 and ADR-0041 WERE repointed, with the
          # repository owner's agreement: each named a heading in ANOTHER document that had
          # since been renamed, and not one word of any record changed.
          #
          # Keyed to an exact (file, fragment) pair, so a different break in the same record
          # still fails this job.
          absent = {
              ('docs/adr/ADR-0020-cli-reads-the-journal-as-rows.md',
               '#owed-work-named-so-it-is-not-lost'),
          }

          def slug(text):
              text = re.sub(r'\[([^\]]*)\]\([^)]*\)', r'\1', text)
              return re.sub(r'[^a-z0-9 -]', '', text.replace('`', '').lower()).replace(' ', '-')

          def headings(path):
              out = set()
              for line in open(path, encoding='utf-8', errors='replace'):
                  m = re.match(r'^#{1,6}\s+(.*?)\s*$', line)
                  if m:
                      out.add(slug(m.group(1)))
              return out

          cache, bad, hit = {}, [], set()
          for root, _, files in os.walk('.'):
              if '.git' in root or '.claude' in root or 'node_modules' in root:
                  continue
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p)
                  for m in re.finditer(r'\[[^\]]*\]\(([^)\s]+)\)',
                                       open(p, encoding='utf-8', errors='replace').read()):
                      link = m.group(1)
                      if link.startswith(('http', 'mailto')) or '#' not in link:
                          continue
                      target, _, fragment = link.partition('#')
                      if not fragment:
                          continue
                      path = p if not target else os.path.normpath(os.path.join(root, target))
                      if not path.endswith('.md') or not os.path.exists(path):
                          continue
                      if path not in cache:
                          cache[path] = headings(path)
                      if fragment in cache[path]:
                          continue
                      if (rel, '#' + fragment) in absent:
                          hit.add((rel, '#' + fragment))
                          continue
                      bad.append(f'{rel} -> {link}')

          # An exemption outlives its reason silently. This one cannot.
          for entry in sorted(absent - hit):
              bad.append(f'{entry[0]} no longer contains {entry[1]} as a broken anchor '
                         '- remove it from the exemption list in this job')

          for b in bad:
              print(f'::error::broken anchor {b}')
          sys.exit(1 if bad else 0)
          PY

  attribution:
    name: Attribution guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: No bot authorship in history
        # Repository owner's standing requirement: commits are authored by people.
        #
        # Scoped to HEAD, not `--all`. `--all` was a live failure, not a hypothetical:
        # `fetch-depth: 0` pulls down every remote branch, including the open
        # `dependabot/*` pull-request branches this repository asks for in
        # .github/dependabot.yml — six of them today, each authored by `dependabot[bot]`
        # and so each matching the pattern below. The job therefore failed on every push
        # to dev and master for commits that are not part of this repository's history,
        # were not written by the author of the change under test, and could not be
        # remediated by them.
        #
        # This is a narrowing of blast radius, not of the rule: every commit that has
        # ever landed is still reachable from HEAD and still audited, and a bot-authored
        # commit inside the change under test is still caught. What is no longer audited
        # is somebody else's unmerged branch.
        run: |
          if git log HEAD --pretty=format:'%an|%ae|%cn|%ce' | grep -iE 'noreply@anthropic|\[bot\]'; then
            echo "::error::A commit is authored by a bot identity."
            exit 1
          fi
          echo "History is clean."

      - name: Every action is pinned to a commit
        # SUPPLY CHAIN, AND THE REASON IT IS HERE RATHER THAN IN A SCANNER. A tag is a
        # movable pointer: `actions/checkout@v4` is whatever that repository decides it is
        # at the moment a job starts, and a compromise of any of these nine repositories runs
        # arbitrary code in a runner that holds GITHUB_TOKEN. All 64 `uses:` in this
        # repository were on tags until this commit. A 40-character SHA is immutable, and the
        # trailing `# v4` is what keeps the file readable — Dependabot's github-actions
        # ecosystem (see .github/dependabot.yml) moves both together, so pinning does not
        # mean going stale.
        #
        # Semgrep's `github-actions-mutable-action-tag` says the same thing and was excluded
        # by name for months because 53 findings was too many to act on at once. That
        # exclusion is gone; this runs whether or not Semgrep does.
        run: |
          unpinned="$(grep -rhoE '^\s*-? *uses: [^ ]+' .github/workflows/*.yml \
            | sed -E 's/^.*uses: //' \
            | grep -vE '@[0-9a-f]{40}$' || true)"

          if [ -n "$unpinned" ]; then
            echo "::error::These actions are on a movable tag rather than a commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "Every action is pinned."

  red:
    name: A red run reaches a person
    # WHY THIS EXISTS. Five of the six jobs above were red on `dev` for days and nothing
    # happened, because nothing could: `dev` is not a protected branch, so a failing check
    # blocks no merge and no push, and no workflow here triggered on a failed run. The
    # whole consequence of a red build was a red icon on a page somebody had to think to
    # open. The suite passes locally, so the people best placed to notice were the least
    # likely to be shown.
    #
    # This repository has already written that finding down twice — CHECKLIST.md blocker
    # B-4 and the unnumbered package above WP-31 in PLAN.md — both about the `Benchmark
    # budgets` job, both concluding "blocking, and blocking nothing: no branch protection,
    # no notification". This is the same defect in a worse place: the job that builds the
    # product and runs the suite.
    #
    # chaos.yml already fixed this for the nightly QR2 run and its `issues: write` comment
    # names B-4 by number. This is that mechanism, for this workflow, deliberately the same
    # so there is one idea in the repository rather than two.
    needs: [build, client, client-e2e, template, aot, manifest, docs, attribution]

    # always(), or it would be skipped by exactly the failures it exists to report. Pushes
    # only: a red pull request is already in front of the person who opened it, and filing
    # an issue for one would be noise.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole point. Without this the run can only be a red icon; with it, a failure
      # reaches a named person's notifications.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, not interpolated into the shell line: a `${{ }}`
          # expansion inside a script is a script-injection shape whatever it holds today.
          FLOWX_NEEDS: ${{ toJSON(needs) }}
          # Same rule, and it was stated here while four expansions below broke it. A branch
          # name is the one an attacker can choose.
          FLOWX_BRANCH: ${{ github.ref_name }}
          FLOWX_COMMIT: ${{ github.sha }}
          FLOWX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLOWX_OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/report-red-run.py \
            --branch "$FLOWX_BRANCH" \
            --commit "$FLOWX_COMMIT" \
            --run-url "$FLOWX_RUN_URL" \
            --owner "$FLOWX_OWNER" \
            --notify
